<!doctype html><html lang="ps" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#125c44"><title>Simple Life</title><style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#172923;--muted:#6b7b74;--green:#176b50;--line:#e0e9e4;--soft:#e8f4ee;--danger:#b42318;--shadow:0 8px 28px #153b2b0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;transition:.2s}body.dark{--bg:#101714;--card:#1a2420;--ink:#eef6f1;--muted:#a4b5ac;--green:#73d4a8;--line:#304139;--soft:#223b30;--danger:#ff8b82;--shadow:0 8px 28px #0003}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}.top{background:linear-gradient(135deg,#104c39,#207d5a);color:white;padding:22px 18px 20px;border-radius:0 0 25px 25px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:25px;font-weight:850;letter-spacing:-.6px}.tag{font-size:12px;opacity:.85;margin-top:3px}.top-actions{display:flex;gap:8px}.iconbtn{border:1px solid #ffffff45;background:#ffffff18;color:white;border-radius:12px;padding:9px 11px;font-size:15px}.welcome{margin-top:20px;font-size:19px;font-weight:700}.subwelcome{font-size:13px;opacity:.84;margin-top:5px}.content{padding:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:3px 0 13px}.sectionhead h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;min-width:0}.stat{font-size:26px;font-weight:800;margin:10px 0 2px}.card-title{font-weight:750;font-size:15px}.emoji{display:inline-grid;place-items:center;width:38px;height:38px;background:var(--soft);border-radius:12px;font-size:19px;margin-bottom:10px}.btn{border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;padding:12px 15px;font-size:14px;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--green);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn.small{padding:8px 10px;font-size:12px}.wide{width:100%}.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none;margin:5px 0 10px}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b501a}.row{display:flex;gap:8px;align-items:center}.row .field{flex:1;min-width:0}.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-main{flex:1;min-width:0}.item-title{font-weight:650;overflow-wrap:anywhere}.item-meta{font-size:12px;color:var(--muted);margin-top:3px}.check{width:21px;height:21px;accent-color:var(--green)}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(5px,calc((100% - 760px)/2)) calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #00008}.nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:6px 2px;border-radius:12px}.nav button span{display:block;font-size:20px;margin-bottom:3px}.nav button.active{background:var(--soft);color:var(--green);font-weight:800}.profile{display:flex;align-items:center;gap:14px}.avatar{width:82px;height:82px;border-radius:22px;object-fit:cover;background:var(--soft)}.pill{display:inline-block;background:var(--soft);color:var(--green);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#172923;color:white;padding:11px 16px;border-radius:12px;z-index:10;display:none;max-width:90%;font-size:13px}.ltr{direction:ltr;text-align:left}.rtl{direction:rtl;text-align:right}.footer{text-align:center;color:var(--muted);font-size:11px;padding:18px 0 6px}@media(min-width:600px){.content{padding:24px}.top{padding:26px </style></head><body><div class="app"><header class="top"><div class="topline"><div><div class="brand">Simple Life</div><div class="tag" data-i="tag">Simple tools. Easier days.</div></div><div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="Theme">☾</button><button class="iconbtn" id="langBtn">PS ▾</button></div></div><div class="welcome" data-i="welcome">ستړی مه شې 👋</div><div class="subwelcome" data-i="subwelcome">ستاسو د ورځني ژوند ساده او افلاین وسایل</div></header><main class="content" id="view"></main><nav class="nav" id="nav"><button data-page="home" class="active"><span>⌂</span><b data-i="home">کور</b></button><button data-page="tasks"><span>✓</span><b data-i="tasks">کارونه</b></button><button data-page="expenses"><span>◉</span><b data-i="expenses">لګښتونه</b></button><button data-page="notes"><span>▤</span><b data-i="notes">یادښتونه</b></button><button data-page="about"><span>◎</span><b data-i="about">زما په اړه</b></button></nav></div><div class="toast" id="toast"></div>
<script>
const dict={ps:{tag:'ساده وسایل، اسانه ورځ',welcome:'ښه راغلاست 👋',subwelcome:'ستاسو د ورځني ژوند ساده او افلاین وسایل',home:'کور',tasks:'کارونه',expenses:'لګښتونه',notes:'یادښتونه',about:'زما په اړه',overview:'لنډیز',todayTasks:'ټول کارونه',totalExpenses:'ټول لګښتونه',savedNotes:'یادښتونه',quick:'چټک لاسرسی',addTask:'＋ نوی کار',addExpense:'＋ نوی لګښت',addNote:'＋ نوی یادښت',taskHint:'د کار نوم ولیکئ…',expenseHint:'د لګښت نوم',amountHint:'اندازه (AFN)',noteHint:'خپل یادښت دلته ولیکئ…',save:'ساتل',cancel:'لغوه',delete:'ړنګول',done:'بشپړ',undo:'بېرته',emptyTasks:'تر اوسه کار نه دی ثبت شوی.',emptyExpenses:'تر اوسه لګښت نه دی ثبت شوی.',emptyNotes:'تر اوسه یادښت نشته.',markDone:'د بشپړولو لپاره لمس کړئ',total:'مجموع',confirmDelete:'دا توکی ړنګ شي؟',saved:'په بریالیتوب خوندي شو',invalid:'مهرباني وکړئ سم معلومات ولیکئ.',profile:'د جوړونکي پېژندنه',creator:'عبدالصمیم نیازی',role:'د Simple Life جوړونکی',location:'لغمان، الینګار، افغانستان',education:'د ارزګان پوهنتون — د درېیم سمستر محصل',bio:'السلام علیکم ورحمة الله وبرکاته! زه عبدالصمیم نیازی یم، د لغمان ولایت د الینګار ولسوالۍ اوسېدونکی او د ارزګان پوهنتون د درېیم سمستر محصل. ما Simple Life د دې لپاره جوړ کړی چې د ورځني ژوند ځینې کارونه اسانه کړي. په افغانستان کې د انټرنېټ لګښت د ډېرو خلکو لپاره ستونزه ده؛ له همدې امله د دې اپلیکیشن اساسي وسایل له انټرنېټ پرته کار کوي. ستاسو نظرونه او وړاندیزونه زما لپاره ارزښت لري.',contact:'اړیکه',share:'شریکول',offline:'افلاین',privacy:'ستاسو کارونه، یادښتونه او لګښتونه په همدې وسیله ساتل کېږي.',all:'ټول',noInternet:'د دې اساسي ځانګړنې لپاره انټرنېټ ته اړتیا نشته.',language:'ژبه'},fa:{tag:'ابزار ساده، روزهای آسان‌تر',welcome:'خوش آمدید 👋',subwelcome:'ابزارهای ساده و آفلاین برای زندگی روزمره',home:'خانه',tasks:'کارها',expenses:'هزینه‌ها',notes:'یادداشت‌ها',about:'درباره من',overview:'خلاصه',todayTasks:'همه کارها',totalExpenses:'مجموع هزینه‌ها',savedNotes:'یادداشت‌ها',quick:'دسترسی سریع',addTask:'＋ کار جدید',addExpense:'＋ هزینه جدید',addNote:'＋ یادداشت جدید',taskHint:'نام کار را بنویسید…',expenseHint:'نام هزینه',amountHint:'مبلغ (افغانی)',noteHint:'یادداشت خود را اینجا بنویسید…',save:'ذخیره',cancel:'لغو',delete:'حذف',done:'انجام شد',undo:'بازگردانی',emptyTasks:'هنوز کاری ثبت نشده است.',emptyExpenses:'هنوز هزینه‌ای ثبت نشده است.',emptyNotes:'هنوز یادداشتی وجود ندارد.',markDone:'برای تکمیل لمس کنید',total:'مجموع',confirmDelete:'این مورد حذف شود؟',saved:'با موفقیت ذخیره شد',invalid:'لطفاً اطلاعات معتبر وارد کنید.',profile:'معرفی سازنده',creator:'عبدالصمیم نیازی',role:'سازنده Simple Life',location:'لغمان، الینگار، افغانستان',education:'دانشجوی سمستر سوم دانشگاه ارزگان',bio:'السلام علیکم ورحمة الله وبرکاته! من عبدالصمیم نیازی، باشنده ولسوالی الینگار ولایت لغمان و محصل سمستر سوم دانشگاه ارزگان هستم. Simple Life را برای آسان‌تر کردن برخی کارهای روزمره ساخته‌ام. چون هزینه اینترنت در افغانستان برای بسیاری از مردم چالش است، ابزارهای اصلی این برنامه بدون اینترنت کار می‌کنند. نظرها و پیشنهادهای شما برایم ارزشمند است.',contact:'تماس',share:'اشتراک‌گذاری',offline:'آفلاین',privacy:'کارها، یادداشت‌ها و هزینه‌های شما روی همین دستگاه ذخیره می‌شوند.',all:'همه',noInternet:'برای این امکانات اصلی اینترنت لازم نیست.',language:'زبان'},en:{tag:'Simple tools. Easier days.',welcome:'Welcome 👋',subwelcome:'Simple offline tools for everyday life',home:'Home',tasks:'Tasks',expenses:'Expenses',notes:'Notes',about:'About',overview:'Overview',todayTasks:'All tasks',totalExpenses:'Total expenses',savedNotes:'Notes saved',quick:'Quick access',addTask:'＋ Add task',addExpense:'＋ Add expense',addNote:'＋ Add note',taskHint:'Enter a task…',expenseHint:'Expense name',amountHint:'Amount (AFN)',noteHint:'Write your note here…',save:'Save',cancel:'Cancel',delete:'Delete',done:'Done',undo:'Undo',emptyTasks:'No tasks yet.',emptyExpenses:'No expenses yet.',emptyNotes:'No notes yet.',markDone:'Tap to mark complete',total:'Total',confirmDelete:'Delete this item?',saved:'Saved successfully',invalid:'Please enter valid information.',profile:'Creator profile',creator:'Abdul Samim Niazai',role:'Creator of Simple Life',location:'Alingar, Laghman, Afghanistan',education:'Third-semester student, Uruzgan University',bio:'Assalamu alaikum wa rahmatullahi wa barakatuh! I am Abdul Samim Niazai, from Alingar district of Laghman, Afghanistan, and a third-semester student at Uruzgan University. I made Simple Life to make some everyday tasks easier. Internet costs are a challenge for many people in Afghanistan, so the core tools in this app work offline. Your feedback and suggestions are valuable to me.',contact:'Contact',share:'Share',offline:'Offline',privacy:'Your tasks, notes and expenses are stored on this device.',all:'All',noInternet:'These core features do not require internet.',language:'Language'}};
let lang=localStorage.getItem('sl_lang')||'ps',dark=localStorage.getItem('sl_dark')==='1',page='home';let tasks=read('sl_tasks'),expenses=read('sl_expenses'),notes=read('sl_notes');function read(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function t(k){return dict[lang][k]||k}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat(lang==='en'?'en-US':lang==='fa'?'fa-IR':'ps-AF',{maximumFractionDigits:2}).format(n)}function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';document.body.classList.toggle('dark',dark);document.getElementById('themeBtn').textContent=dark?'☀':'☾';document.getElementById('langBtn').textContent=({ps:'PS',fa:'FA',en:'EN'})[lang]+' ▾';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2100)}function card(icon,title,detail,onclick){return `<div class="card" ${onclick?`onclick="${onclick}" role="button"`:''}><div class="emoji">${icon}</div><div class="card-title">${title}</div><div class="muted" style="margin-top:5px">${detail}</div></div>`}function render(){let v=document.getElementById('view');if(page==='home'){let total=expenses.reduce((a,x)=>a+Number(x.amount||0),0);v.innerHTML=`<div class="sectionhead"><h2>${t('overview')}</h2><span class="pill">● ${t('offline')}</span></div><div class="grid">${card('✓',t('todayTasks'),`<strong>${tasks.length}</strong> · ${tasks.filter(x=>x.done).length} ${t('done')}`,'go(\'tasks\')')}${card('◉',t('totalExpenses'),`<strong>${money(total)}</strong> AFN`,'go(\'expenses\')')}${card('▤',t('savedNotes'),`<strong>${notes.length}</strong>`,'go(\'notes\')')}</div><div class="sectionhead" style="margin-top:24px"><h2>${t('quick')}</h2></div><div class="grid">${card('＋',t('addTask'),t('taskHint'),'quickAdd(\'task\')')}${card('＋',t('addExpense'),t('expenseHint'),'quickAdd(\'expense\')')}${card('＋',t('addNote'),t('noteHint'),'quickAdd(\'note\')')}</div><div class="card"><div class="card-title">🔒 ${t('privacy')}</div><p class="muted">${t('noInternet')}</p></div><div class="footer">Simple Life · v1.1</div>`}else if(page==='tasks'){v.innerHTML=`<div class="sectionhead"><h2>${t('tasks')}</h2><span class="pill">${tasks.length} ${t('all')}</span></div><form id="taskForm" class="card"><label class="card-title" for="taskInput">${t('addTask')}</label><div class="row"><input id="taskInput" class="field" placeholder="${t('taskHint')}" required maxlength="180"><button class="btn">${t('save')}</button></div></form><div class="card">${tasks.length?tasks.map((x,i)=>`<div class="item"><input class="check" type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${i})"><div class="item-main"><div class="item-title" style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.title)}</div><div class="item-meta">${x.done?t('done'):t('markDone')}</div></div><button class="btn secondary small" onclick="removeItem('tasks',${i})">${t('delete')}</button></div>`).join(''):`<div class="empty">✓<p>${t('emptyTasks')}</p></div>`}</div>`;document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let s=document.getElementById('taskInput').value.trim();if(s){tasks.unshift({title:s,done:false});save('sl_tasks',tasks);toast(t('saved'));render()}}}else if(page==='expenses'){let total=expenses.reduce((a,x)=>a+Number(x.amount),0);v.innerHTML=`<div class="sectionhead"><h2>${t('expenses')}</h2></div><div class="card"><div class="muted">${t('total')}</div><div class="stat">${money(total)} <small style="font-size:13px">AFN</small></div></div><form id="expenseForm" class="card"><label class="card-title">${t('addExpense')}</label><input id="expenseName" class="field" placeholder="${t('expenseHint')}" maxlength="100" required><input id="expenseAmount" class="field ${lang==='en'?'ltr':''}" type="number" min="0.01" step="0.01" placeholder="${t('amountHint')}" required><button class="btn wide">${t('save')}</button></form><div class="card">${expenses.length?expenses.map((x,i)=>`<div class="item"><div class="item-main"><div class="item-title">${esc(x.title)}</div><div class="item-meta">${esc(x.date||'')}</div></div><strong>${money(x.amount)} AFN</strong><button class="btn secondary small" onclick="removeItem('expenses',${i})">${t('delete')}</button></div>`).join(''):`<div class="empty">◉<p>${t('emptyExpenses')}</p></div>`}</div>`;document.getElementById('expenseForm').onsubmit=e=>{e.preventDefault();let title=document.getElementById('expenseName').value.trim(),amount=Number(document.getElementById('expenseAmount').value);if(title&&amount>0){expenses.unshift({title,amount,date:new Date().toLocaleDateString()});save('sl_expenses',expenses);toast(t('saved'));render()}}}else if(page==='notes'){v.innerHTML=`<div class="sectionhead"><h2>${t('notes')}</h2></div><form id="noteForm" class="card"><textarea id="noteInput" class="field" rows="4" placeholder="${t('noteHint')}" maxlength="3000" required></textarea><button class="btn wide">${t('save')}</button></form><div class="card">${notes.length?notes.map((x,i)=>`<div class="item"><div class="item-main"><div class="item-title">${esc(x.text).replace(/\n/g,'<br>')}</div><div class="item-meta">${esc(x.date||'')}</div></div><button class="btn secondary small" onclick="shareNote(${i})">↗</button><button class="btn danger small" onclick="removeItem('notes',${i})">${t('delete')}</button></div>`).join(''):`<div class="empty">▤<p>${t('emptyNotes')}</p></div>`}</div>`;document.getElementById('noteForm').onsubmit=e=>{e.preventDefault();let s=document.getElementById('noteInput').value.trim();if(s){notes.unshift({text:s,date:new Date().toLocaleString()});save('sl_notes',notes);toast(t('saved'));render()}}}else{v.innerHTML=`<div class="card"><div class="profile"><img class="avatar" src="profile.png" onerror="this.style.display='none'" alt="${t('creator')}"><div><div class="card-title" style="font-size:20px">${t('creator')}</div><div class="muted">${t('role')}</div><span class="pill">Simple Life · v1.1</span></div></div></div><div class="card"><div class="card-title">${t('profile')}</div><p style="line-height:1.9">${t('bio')}</p><div class="muted">📍 ${t('location')}</div><div class="muted" style="margin-top:8px">🎓 ${t('education')}</div></div><div class="card"><div class="card-title">${t('contact')}</div><div class="item"><div class="item-main"><div class="item-title">✉ Gmail</div><div class="item-meta ltr">samimpatan8@gmail.com</div></div><button class="btn secondary small" onclick="copyText('samimpatan8@gmail.com')">${t('share')}</button></div>${[['Etisalat','0789591758'],['AWCC / Atoma','0767803096'],['Salaam','0747320602']].map(a=>`<div class="item"><div class="item-main"><div class="item-title">📱 ${a[0]}</div><div class="item-meta ltr">${a[1]}</div></div><button class="btn secondary small" onclick="copyText('${a[1]}')">${t('share')}</button></div>`).join('')}</div><div class="card"><div class="card-title">⚙ ${t('language')}</div><div class="row"><button class="btn secondary" onclick="setLang('ps')">پښتو</button><button class="btn secondary" onclick="setLang('fa')">فارسی</button><button class="btn secondary" onclick="setLang('en')">English</button></div><p class="muted">${t('privacy')}</p></div><button class="btn wide" onclick="shareApp()">↗ ${t('share')}</button>`}}
function go(p){page=p;apply()}function setLang(l){lang=l;localStorage.setItem('sl_lang',l);apply()}function quickAdd(kind){go(kind==='task'?'tasks':kind==='expense'?'expenses':'notes')}function toggleTask(i){tasks[i].done=!tasks[i].done;save('sl_tasks',tasks);render()}function removeItem(kind,i){if(!confirm(t('confirmDelete')))return;if(kind==='tasks'){tasks.splice(i,1);save('sl_tasks',tasks)}if(kind==='expenses'){expenses.splice(i,1);save('sl_expenses',expenses)}if(kind==='notes'){notes.splice(i,1);save('sl_notes',notes)}toast(t('saved'));render()}function copyText(s){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast(t('saved'))).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){let a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(t('saved'))}catch(e){toast(s)}a.remove()}function shareNote(i){copyText(notes[i].text)}function shareApp(){copyText('Simple Life — '+t('subwelcome')+'\nAbdul Samim Niazai\nsamimpatan8@gmail.com')}document.getElementById('themeBtn').onclick=()=>{dark=!dark;localStorage.setItem('sl_dark',dark?'1':'0');apply()};document.getElementById('langBtn').onclick=()=>setLang(lang==='ps'?'fa':lang==='fa'?'en':'ps');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;apply()});apply();
</script></body></html>
